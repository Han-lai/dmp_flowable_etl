mdm_mfg_plant:
  source: "APP_SRV_COMMON.dbo.MDM_MFG_PLANT_MASTER_0202"
  target: "bronze.common_mdm_mfg_plant_master"
  strategy: "full"
  engine_ddl: "MFG_PLANT_ID String, MFG_PLANT_CODE String, MFG_PLANT_DESC String, FACTORY String, VALIDITY String"
  columns: "MFG_PLANT_ID, MFG_PLANT_CODE, MFG_PLANT_DESC, FACTORY, VALIDITY"

dmp_func_config:
  source: "APP_SRV_COMMON.dbo.DMPFunctionConfig_0202"
  target: "bronze.common_dmp_function_config"
  strategy: "full"
  engine_ddl: "ID Int64, FunctionCode String, Plant String, Factory String, ProductionArea String, LineName String, AssignLineFlag String, Updater String, UpdateDatetime DateTime, UpdateCount Int64, Creator String, CreateDatetime DateTime, StartDps String, AssignWorkStatus String, EffectiveStartDate DateTime, EffectiveEndDate DateTime, SyncESB String"
  columns: "*"

dmp_func_client_mapping:
  source: "APP_SRV_COMMON.dbo.DMPFunctionClientMapping_0202"
  target: "bronze.common_dmp_function_client_mapping"
  strategy: "full"
