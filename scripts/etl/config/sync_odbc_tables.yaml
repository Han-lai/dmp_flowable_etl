  columns: "*"

taskinst:
  source: "APP_SRV_BPM.dbo.ACT_HI_TASKINST_0108"
  target: "bronze.bpm_act_hi_taskinst"
  time_col: "LAST_UPDATED_TIME_"
  strategy: "batch"
  step_days: 10
  engine_ddl: >
    ID_ String, REV_ Int32, PROC_DEF_ID_ String, TASK_DEF_KEY_ String, PROC_INST_ID_ String, EXECUTION_ID_ String, NAME_ String, ASSIGNEE_ String, START_TIME_ DateTime, CLAIM_TIME_ DateTime, END_TIME_ DateTime, DURATION_ Int64, DELETE_REASON_ String, LAST_UPDATED_TIME_ DateTime
  columns: "ID_, REV_, PROC_DEF_ID_, TASK_DEF_KEY_, PROC_INST_ID_, EXECUTION_ID_, NAME_, ASSIGNEE_, START_TIME_, CLAIM_TIME_, END_TIME_, DURATION_, DELETE_REASON_, LAST_UPDATED_TIME_"

varinst:
  source: "APP_SRV_BPM.dbo.ACT_HI_VARINST_0108"
  target: "bronze.bpm_act_hi_varinst"
  time_col: "CREATE_TIME_"
  strategy: "batch"
  step_days: 10
  engine_ddl: "PROC_INST_ID_ String, TASK_ID_ String, NAME_ String, TEXT_ String, REV_ Int32, LONG_ Int64, CREATE_TIME_ DateTime"
