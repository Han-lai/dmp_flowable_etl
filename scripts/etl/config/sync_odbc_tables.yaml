# ClickHouse Bronze Layer Sync Configuration (ODBC)
# This file centralizes the mapping between MSSQL source tables and ClickHouse bronze tables.

hr_employee:
  source: "APP_SRV_COMMON.dbo.HR_Employee_0202"
  target: "bronze.common_hr_employee"
  strategy: "batch"
  time_col: "ModifyDate"
  step_days: 30
  engine_ddl: >
    EmpCode String, DeptCode String, TerminateDate DateTime, ModifyDate DateTime
  columns: "EmpCode, DeptCode, if(TerminateDate = toDateTime(0), 1, 0) AS IsActive, ModifyDate"

emp_node_role:
  source: "APP_SRV_COMMON.dbo.EmpNodeRoleMapping_0202"
  target: "bronze.common_emp_node_role_mapping"
  strategy: "full"
  engine_ddl: "EmpCode String, NodeCode String, UpdateTime DateTime, UpdateEmp String"
  columns: "EmpCode, NodeCode, UpdateTime, UpdateEmp"

emp_org_info:
  source: "APP_SRV_COMMON.dbo.EmpOrgInfoMapping_0202"
  target: "bronze.common_emp_org_info_mapping"
  strategy: "full"
  engine_ddl: "EmpCode String, Plant String, MFGFactoryId String, UpdateTime DateTime, UpdateEmp String"
  columns: "EmpCode, Plant, MFGFactoryId, UpdateTime, UpdateEmp"

emp_user_group:
  source: "APP_SRV_COMMON.dbo.EmpUserGroupMapping_0202"
  target: "bronze.common_emp_user_group_mapping"
  strategy: "full"
  engine_ddl: "EmpCode String, UserGroupId Int32, UpdateTime DateTime, UpdateEmp String"
  columns: "EmpCode, UserGroupId, UpdateTime, UpdateEmp"

user_group:
  source: "APP_SRV_COMMON.dbo.UserGroup_0202"
  target: "bronze.common_user_group"
  strategy: "full"
  engine_ddl: "UserGroupId Int32, UserGroupName String, UserGroupDesc String, UpdateTime DateTime, UpdateEmp String"
  columns: "UserGroupId, UserGroupName, UserGroupDesc, UpdateTime, UpdateEmp"

process_role_user:
  source: "APP_SRV_COMMON.dbo.ProcessRoleUserMapping_0202"
  target: "bronze.common_process_role_user_mapping"
  strategy: "full"
  engine_ddl: "ID Int32, RoleId String, Plant String, Factory String, ProductionArea String, LineName String, EmpCode String, Updater String, UpdateDatetime DateTime, UpdateCount Int32, Creator String, CreateDatetime DateTime"
  columns: "ID, RoleId, Plant, Factory, ProductionArea, LineName, EmpCode, Updater, UpdateDatetime, UpdateCount, Creator, CreateDatetime"

mdm_line_desc:
  source: "APP_SRV_COMMON.dbo.MDM_LINE_DESC_MASTER_0202"
  target: "bronze.common_mdm_line_desc_master"
  strategy: "full"
  engine_ddl: "LINE_NAME String, LINE_DESC String, PROD_AREA_ID String"
  columns: "LINE_NAME, LINE_DESC, PROD_AREA_ID"

mdm_prod_area:
  source: "APP_SRV_COMMON.dbo.MDM_PROD_AREA_MASTER_0202"
  target: "bronze.common_mdm_prod_area_master"
  strategy: "full"
  engine_ddl: "PROD_AREA_ID String, PROD_AREA_CODE String, FACTORY String, MFG_PLANT_ID String"
  columns: "PROD_AREA_ID, PROD_AREA_CODE, FACTORY, MFG_PLANT_ID"

mdm_factory_area:
  source: "APP_SRV_COMMON.dbo.MDM_FACTORY_AREA_MASTER_0202"
  target: "bronze.common_mdm_factory_area_master"
  strategy: "full"
  engine_ddl: "FACTORY String, FACTORY_DESC String, PLANT_NODE String, PLANT_NODE_DESC String, REGION String, MFG_SITE String"
  columns: "FACTORY, FACTORY_DESC, PLANT_NODE, PLANT_NODE_DESC, REGION, MFG_SITE"

mdm_mfg_site:
  source: "APP_SRV_COMMON.dbo.MDM_MFG_SITE_MASTER_0202"
  target: "bronze.common_mdm_mfg_site_master"
  strategy: "full"
