services:
  # ClickHouse Server
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: clickhouse-server
    ports:
      - "8121:8123"
      - "9001:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/config:/var/lib/clickhouse/server/config.d
    environment:
      - CLICKHOUSE_DB=bronze
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=default
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - clickhouse-net
    command: >
      /bin/bash -c "
      mkdir -p /etc/clickhouse-server/config.d &&
      echo '<clickhouse>
        <listen_host>0.0.0.0</listen_host>
        <jdbc_bridge>
          <host>jdbc-bridge</host>
          <port>9019</port>
        </jdbc_bridge>
      </clickhouse>' > /etc/clickhouse-server/config.d/config.xml &&
      /entrypoint.sh
      "

  # JDBC Bridge for connecting to MSSQL
  jdbc-bridge:
    image: clickhouse/jdbc-bridge:2.1.0
    container_name: clickhouse-jdbc-bridge
    ports:
      - "9019:9019"
    volumes:
      - ./jdbc-bridge/config/datasources:/etc/clickhouse-jdbc-bridge/config/datasources
      - ./jdbc-bridge/drivers:/etc/clickhouse-jdbc-bridge/drivers
      - ./jdbc-bridge/drivers:/app/drivers
    environment:
      - CONFIG_PATH=/app/config
    depends_on:
      - clickhouse
    networks:
      - clickhouse-net

volumes:
  clickhouse-data:

networks:
  clickhouse-net:
    driver: bridge
