version: '3.8'

services:
  cube:
    image: cubejs/cube:latest
    container_name: cubejs
    ports:
      - "4002:4000"      # Cube.js REST API
      - "4003:4001"      # Cube.js Playground (開發 UI)
    env_file:
      - ../.env
    environment:
      # ClickHouse 連線設定
      - CUBEJS_DB_TYPE=clickhouse
      - CUBEJS_DB_HOST=${CLICKHOUSE_HOST}
      - CUBEJS_DB_PORT=8121
      - CUBEJS_DB_USER=default
      - CUBEJS_DB_PASS=${CLICKHOUSE_PASSWORD}
      - CUBEJS_DB_NAME=silver
      
      # Cube.js 設定
      - CUBEJS_DEV_MODE=true
      - CUBEJS_API_SECRET=${CUBEJS_API_SECRET}
      - CUBEJS_SCHEDULED_REFRESH_DEFAULT=true
      - CUBEJS_WEB_SOCKETS=true
      
      # 預聚合設定
      - CUBEJS_PRE_AGGREGATIONS_SCHEMA=pre_agg
      - CUBEJS_EXTERNAL_DEFAULT=false
      
      # 日誌設定
      - CUBEJS_LOG_LEVEL=info
      
    volumes:
      # 官方標準：model 目錄掛載到 /cube/conf/model
      - ../../cube/model:/cube/conf/model
    restart: unless-stopped
    networks:
      - cube-network

networks:
  cube-network:
    driver: bridge
