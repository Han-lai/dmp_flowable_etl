services:
  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports:
      - "9003:3000"
    environment:
      # MONITOR_HOST / GRAFANA_ADMIN_PASSWORD 由同目錄 .env 提供（不進版控），缺失時 compose 直接報錯
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in infra/monitoring/.env}
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
      - GF_SERVER_ROOT_URL=http://${MONITOR_HOST:?MONITOR_HOST must be set in infra/monitoring/.env}:9003
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=deltarelay.deltaww.com:25
      - GF_SMTP_FROM_ADDRESS=grafana-alert@deltaww.com
      - GF_SMTP_FROM_NAME=Grafana Alert (DMP Flowable)
      - GF_SMTP_SKIP_VERIFY=true
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - prometheus

  prometheus:
    image: dcr-twtpe.deltaww.com/docker.io/prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9011:9090"

    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /etc/prometheus &&
        echo "global:
          scrape_interval: 15s

        scrape_configs:
          - job_name: 'prometheus'
            static_configs:
              - targets: ['localhost:9090']

          - job_name: 'clickhouse-metrics'
            static_configs:
              - targets: ['${MONITOR_HOST}:9363']
                labels:
                  instance: 'clickhouse-primary'

          - job_name: 'node-exporter'
            static_configs:
              - targets: ['${MONITOR_HOST}:9111']
                labels:
                  instance: 'docker-host'" > /etc/prometheus/prometheus.yml && /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus
    volumes:
      - prometheus-data:/prometheus
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter

    ports:
      - "9111:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    ports:
      - "8085:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true
    restart: unless-stopped

volumes:
  grafana-data:
  prometheus-data: