services:
  api:
    image: python:3.10-slim
    container_name: flowable_pipeline_api
    working_dir: /app
    ports:
      - "7088:8000"
    volumes:

      - ${VOLUMES_ROOT}/api/main.py:/app/main.py
      - ${VOLUMES_ROOT}/api/requirements.txt:/app/requirements.txt
      - ${VOLUMES_ROOT}/api/logs:/app/logs
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt && 
             python main.py"
    environment:
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST:-10.136.218.207}
      - CLICKHOUSE_PORT=${CLICKHOUSE_PORT:-8121}
      - CLICKHOUSE_USERNAME=${CLICKHOUSE_USERNAME:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-default}
    restart: always
